schema: dotai.pack/v1
name: dotai-lartweib-pack
version: 0.2.0 # x-release-please-version (release-please bumps it, pack 0048)
engine: ">=0.2.0" # dotai v0.2.0 embeds the rulesync 43.12.0 checksums
rulesync: 43.12.0 # the only version whose checksums the engine embeds (dotai 0029); needs dotai v0.2.0
harnesses: [claudecode, antigravity-cli, opencode] # compatible (dotai 0047); OpenCode is supported since dotai v0.2.0 and managed when detected
requires: [] # installs on Claude Code, agy or both; delegation needs both (0050). OpenCode is minimal, occasional use (0009)

profiles: # set from 0044. dotai's dotai-profiles skill knows each profile only by its description
  # and hints (dotai 0045, pack 0047). Hints are path.Match globs over the whole repo-relative path
  # of tracked files (git ls-files): `package.json` is the root one only. Installed packages are untracked,
  # so a package.json dependency goes in the description.
  godot:
    path: profiles/godot
    description: Godot 4 games in GDScript (project.godot, .gd scripts, .tscn scenes).
    hints: [project.godot, export_presets.cfg]
  autonomous-orchestra:
    path: profiles/autonomous-orchestra
    description: Long unattended work on any stack (worktree lanes, scheduled runs, monitors). No marker files; suggest it only when the user plans long autonomous runs.
    hints: []
  web:
    path: profiles/web
    description: Web apps on Astro, Next.js, SvelteKit or Vite (the framework in package.json); build and checks.
    hints: [astro.config.*, next.config.*, svelte.config.*, vite.config.*, index.html]
  ui:
    path: profiles/ui
    description: Design skills and browser capture for any project with a UI (components, CSS, tailwindcss in package.json).
    hints: [DESIGN.md, components.json, tailwind.config.*, playwright.config.*, astro.config.*, next.config.*, vite.config.*]
  seo:
    path: profiles/seo
    description: SEO audits of a public site. No marker files; suggest it only when the user asks for an audit, and remove it afterwards.
    hints: []
  cloudflare:
    path: profiles/cloudflare
    description: Cloudflare Workers and Pages with wrangler (a wrangler config, or wrangler in package.json).
    hints: [wrangler.toml, wrangler.jsonc, wrangler.json]
  vercel:
    path: profiles/vercel
    description: Apps deployed on Vercel, through the vercel CLI (link, env, deploys, logs). Many have no vercel.json, so ask.
    hints: [vercel.json, vercel.ts] # .vercel/ is untracked
  video:
    path: profiles/video
    description: Making and analyzing video (Remotion with @remotion/* in package.json, Hyperframes, video files to review).
    hints: [remotion.config.*, hyperframes/*]
  tooling:
    path: profiles/tooling
    description: CLIs, scripts and developer tooling in Go or Python, and JS tool workspaces (pnpm, Biome).
    hints: [go.mod, pyproject.toml, pnpm-workspace.yaml, biome.json, biome.jsonc] # no Cargo.toml: no Rust project yet
  desktop:
    path: profiles/desktop
    description: Desktop apps with Electron (electron in package.json, electron-builder or Electron Forge).
    hints: [electron-builder.*, forge.config.*, electron.vite.config.*]

variants:
  standalone:
    path: variants/standalone
    default: true
  orca:
    path: variants/orca
    detect: { command: orca }
    shared-skills: true
