name: ci

# Runs scripts/check.mjs (pack 0048): tests, dotai validate per variant, the git-pack tree
# check and the privacy guard. Every job is off while the repository is private, so nothing
# runs or bills until it is public.
on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The engine has no release yet: dotai is built from this engine commit. Bump it on purpose.
  ENGINE_REF: 3b49b05e3074eee778964db4881b5f8926e15f19

jobs:
  check:
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # Pack and engine side by side, so node --test and the git checks see only the pack.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pack
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Lartweib/dotai
          ref: ${{ env.ENGINE_REF }}
          path: engine
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: build dotai
        working-directory: engine
        run: go build -o "$RUNNER_TEMP/dotai$([ "$RUNNER_OS" = Windows ] && echo .exe)" ./cmd/dotai
      - name: check
        working-directory: pack
        env:
          # Extra names the privacy guard looks for, comma-separated (a repository variable).
          DOTAI_PRIVACY_TERMS: ${{ vars.DOTAI_PRIVACY_TERMS }}
        run: DOTAI="$RUNNER_TEMP/dotai$([ "$RUNNER_OS" = Windows ] && echo .exe)" node scripts/check.mjs
