name: Commits

# A required check on main. The release workflow dispatches it on the release pull request's
# branch (a pull request opened with the workflow token triggers no workflow), passing the title.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:
    inputs:
      title:
        description: The pull request title
        required: true

permissions:
  contents: read

jobs:
  commits:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the commit messages and the pull request title
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TITLE: ${{ github.event.pull_request.title || inputs.title }}
        run: node .github/scripts/check-commits.mjs "$BASE" "$HEAD" "$TITLE"
