name: release

# Every push to main runs the checks, then release-please (pack 0048): it opens or updates the
# release pull request from the conventional commits since the last tag (version in dotai.yaml,
# CHANGELOG.md), and when that pull request is merged it tags vX.Y.Z and publishes the release.
# A pull request opened with the workflow token triggers no workflow, so this job dispatches the
# required checks (ci, commits) on the release branch itself. Off while the repository is private.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: ${{ !github.event.repository.private }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release-please:
    if: ${{ !github.event.repository.private }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the release commit, the tag and the release
      pull-requests: write # the release pull request
      actions: write # dispatch the checks on the release branch
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      - name: Run the required checks on the release pull request
        if: ${{ steps.rp.outputs.pr }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ fromJSON(steps.rp.outputs.pr).headBranchName }}
          TITLE: ${{ fromJSON(steps.rp.outputs.pr).title }}
        run: |
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run commits.yml --ref "$BRANCH" -f title="$TITLE"
